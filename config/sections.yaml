# Newsletter sections.
#
# Daily email structure:
#   1. Alerts            — config/alerts.yaml; fires regardless of cadence.
#   2. Breakthroughs     — ANY section with `breakthrough: true` force-renders
#                          when its 24h volume beats its own trailing baseline.
#   3. Daily core        — cadence: daily (risk watch, cyber, Tech Daily, Top News).
#   4. Rotating dives    — cadence: rotate; `rotation.slots_per_day` topics/day,
#                          round-robin in the order listed below, skipped when a
#                          topic has nothing unsent (that's how "1 or 2" happens).
#                          Cursor lives in SQLite and only advances on a real send.
#   5. Fixed weekly      — cadence: weekly (aviation Tue, hazard Thu).
#
# cadence:
#   daily         — renders every run.
#   weekly        — renders on `weekday` (0=Mon..6=Sun) or any of `weekdays: [..]`.
#   rotate        — scheduled by the rotation selector (main.py), pool order = file order.
#   breakthrough  — overlay-only: never scheduled, spikes only.
# breakthrough: true (or a params dict) on ANY section adds the spike overlay:
#   params: baseline_days (28), multiplier (2.5), min_items (8),
#           min_history_days (7), lookback_hours (36 — spike renders stay small).
#   Sparse hobby/life buckets deliberately have NO overlay — their feeds are
#   complementary, so volume spikes there are meaningless.
#
# sources: [bucket, ...] — composite sections draw from several buckets
#   (default: own id). sent_log is per-bucket and an in-run ledger prevents
#   same-day repeats, so overlapping sections (Top News + a news-tier deep
#   dive, Tech Daily + FOSS deep dive) never show the same story twice.
#
# boost / demote: keyword lists re-rank clusters BEFORE the max_clusters cut.
# llm_task maps to a model route in config/llm.yaml.
#
# Note: the legacy `area` section was dropped — no FreshRSS category maps to it.

rotation:
  slots_per_day: 2

# Brand strings for the email. All three keys are OPTIONAL — delete any of them
# (or the whole block) and the shipped default below is used instead, producing
# exactly the output this pipeline sent before the strings were configurable.
#
#   title           — <title>, the <h1>, and the {title} field of subject_format.
#   footer          — the small print at the bottom of the email.
#   subject_format  — str.format with two fields: {title} and {date}, where
#                     {date} is a datetime (so {date:%b %d}, {date:%Y-%m-%d} …).
#
# title and footer are HTML-escaped on render; write plain text, not markup.
# A malformed subject_format logs and falls back rather than losing the send.
newsletter:
  title: "Passband Digest"
  footer: "Generated by Passband. Sections curated from FreshRSS via TF-IDF clustering + local LLM."
  subject_format: "{title} — {date:%b %d}"

sections:
  # ========================= DAILY CORE =====================================
  # Steered: daily but small, ranked toward the homelab / self-hosted /
  # consulting stack instead of the corroborated breach-of-the-week.
  - id: cyber
    title: "Cyber Threat Intel"
    cadence: daily
    lookback_hours: 36
    max_clusters: 3
    llm_task: risk_synthesis
    boost:
      - self-hosted
      - selfhosted
      - homelab
      - home lab
      - proxmox
      - docker
      - kubernetes
      - unifi
      - ubiquiti
      - pfsense
      - opnsense
      - tailscale
      - wireguard
      - synology
      - nas
      - router
      - firmware
      - open source
      - npm
      - pypi
      - github
      - supply chain
      - actively exploited
      - rce
      - vpn
      - prompt injection
      - llm
      - ai agent
      - mcp
      - microsoft 365
      - entra
      - azure
      - okta
      - identity
    demote:
      - arrested
      - sentenced
      - indicted
      - extradited
      - crypto heist
      - darknet

  # One composite tech slot daily; topic rotates by what's noteworthy
  # (AI, agents, RPA, FOSS, hardware, industry criticism). Security is
  # covered by cyber above; each source bucket also gets a rotating deep dive.
  - id: tech
    title: "Tech Daily"
    cadence: daily
    sources: [ai, foss, maker, tech_power]
    lookback_hours: 30
    max_clusters: 5
    llm_task: summarize
    boost:
      - agent
      - agentic
      - mcp
      - llm
      - claude
      - openai
      - gpt-
      - gemini
      - open-weight
      - open weights
      - local model
      - inference
      - fine-tun
      - rpa
      - automation
      - orchestration
      - workflow
      - self-hosted
      - benchmark
      - raspberry pi
      - esp32

  # Biggest stories across the news tiers; each tier also gets its own
  # rotating deep dive + breakthrough overlay below, deduped per-bucket.
  - id: top_news
    title: "Top News"
    cadence: daily
    sources: [global, national, state, local]
    lookback_hours: 30
    max_clusters: 6
    llm_task: summarize

  # ================= FIXED WEEKLY DEEP DIVES (+ spike overlay) ==============
  # Quiet weeks: one scheduled roundup. Loud days: breakthrough forces a
  # same-day render covering just the spike (36h), and truly critical events
  # surface via the Alerts layer regardless.
  # NOTE: consider removing the raw "USGS Earthquakes M2.5+" and "NWS Active
  # Alerts" feeds from the FreshRSS hazard category — the structured USGS/NWS
  # collectors in alerts.yaml cover them with real thresholds, and pruning
  # them cleans this bucket's baseline.
  - id: aviation
    title: "Aviation & Travel"
    cadence: weekly
    weekday: 1          # Tuesday
    breakthrough: true
    lookback_hours: 168
    max_clusters: 5
    llm_task: risk_synthesis

  - id: hazard
    title: "Hazard & Disaster"
    cadence: weekly
    weekday: 3          # Thursday
    breakthrough: true
    lookback_hours: 168
    max_clusters: 6
    llm_task: risk_synthesis

  # ===================== ROTATING DEEP-DIVE POOL ============================
  # Order = rotation order (interleaved so consecutive days vary in flavor).
  # Signal/news/geo topics carry the breakthrough overlay: a spike renders
  # same-day instead of waiting for its turn. Hobby/life/career topics don't.
